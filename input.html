<html>
    <head>
        <title>Form Pendaftaran</title>
    </head>
    <body>
        <h2>Form Pendaftaran</h2>
        <form>
            <table>
                <tr>
                    <td>Nama Lengkap</td>
                    <td>:</td>
                    <td><input type="text" name="nama" required></td>
                </tr>
                <tr>
                    <td>No HP</td>
                    <td>:</td>
                    <td><input type="number" name="hp" required placeholder="Masukkan No HP"></td>
                </tr>
                <tr>
                    <td>Email</td>
                    <td>:</td>
                    <td><input type="email" name="email" required placeholder="Masukkan Email"></td>
                </tr>
                <tr>
                    <td>Password</td>
                    <td>:</td>
                    <td><input type="password" name="password" required placeholder="Masukkan Password"></td>
                </tr>
                <tr>
                    <td>Tanggal Lahir</td>
                    <td>:</td>
                    <td><input type="date" name="tanggal_lahir" required></td>
                </tr>
                <tr>
                    <td>Jenis Kelamin</td>
                    <td>:</td>
                    <td>
                        <input type="radio" name="jenis_kelamin" value="Laki-laki" required> Laki-laki
                        <input type="radio" name="jenis_kelamin" value="Perempuan" required> Perempuan
                    </td>
                </tr>
                <tr>
                    <td>Hobby</td>
                    <td>:</td>
                    <td>
                        <input type="checkbox" name="hobby" value="Membaca" required> Membaca
                        <input type="checkbox" name="hobby" value="Menulis" required> Menulis
                        <input type="checkbox" name="hobby" value="Olahraga" required> Olahraga
                        <input type="checkbox" name="hobby" value="Bermain Game" required> Bermain Game
                        <input type="checkbox" name="hobby" value="Berenang" required> Berenang
                        <input type="checkbox" name="hobby" value="Memasak" required> Memasak
                        <input type="checkbox" name="hobby" value="Bersepeda" required> Bersepeda
                        <input type="checkbox" name="hobby" value="Lainnya" required> Lainnya
                    </td>
                </tr>
                <tr>
                    <td>Alamat</td>
                    <td>:</td>
                    <td><textarea name="alamat" required placeholder="Masukkan Alamat"></textarea></td>
                </tr>
                <tr>
                    <td>Jurusan</td>
                    <td>:</td>
                    <td>
                        <select id="jurusan" name="jurusan" required>
                            <option value="RPL">Rekayasa Perangkat Lunak</option>
                            <option value="TKJ">Teknik Komputer dan Jaringan</option>
                            <option value="DG">Desain Grafis</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>Foto</td>
                    <td>:</td>
                    <td><input type="file" name="foto" required></td>
                </tr>
                <tr>
                    <td colspan="3" align="center">
                        <input type="submit" value="Daftar">
                        <input type="reset" value="Reset">
                    </td>
                </tr>
            </table>
        </form>
    </body>
</html>
